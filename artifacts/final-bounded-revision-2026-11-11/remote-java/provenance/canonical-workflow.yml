name: Independent native Ekstazi canonical-fingerprint experiment
on:
  push:
    branches: [research/ekstazi-canonical-collision-20261109]
permissions:
  contents: read
jobs:
  native-ekstazi:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Run published Ekstazi 5.3.0 on paired controlled revisions
        run: python3 research_20261107/ekstazi/runner/experiment.py "$RUNNER_TEMP/native-ekstazi"
      - name: Test original upstream Apache Commons Validator sources and tests
        run: python3 research_20261107/ekstazi/runner/commons_experiment.py "$RUNNER_TEMP/upstream-commons"
      - name: Save all outcomes including negative results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: independent-ekstazi-collision-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/native-ekstazi/
            ${{ runner.temp }}/upstream-commons/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: warn
