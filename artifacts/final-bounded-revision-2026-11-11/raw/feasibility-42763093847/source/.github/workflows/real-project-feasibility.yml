name: SP2027 genuine upstream RTS baseline feasibility
on:
  push:
    branches: [research/real-project-feasibility-20261109]
permissions:
  contents: read
jobs:
  eligible:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - {lang: "python", name: "itsdangerous", repository: "pallets/itsdangerous", sha: "672971d66a2ef9f85151e53283113f33d642dabd"}
          - {lang: "python", name: "click", repository: "pallets/click", sha: "8abb77a8432e03ed14a95f972b44f905279415a7"}
          - {lang: "python", name: "requests", repository: "psf/requests", sha: "3c7baaa05ab4aa49cc819ce3a819d260de19c157"}
          - {lang: "python", name: "starlette", repository: "Kludex/starlette", sha: "271c277da0ff64e2048a4d46ecc812b9d61db5f6"}
          - {lang: "python", name: "urllib3", repository: "urllib3/urllib3", sha: "c5347bbd39203d68d7b0e3ffb83ced3e3b4b9109"}
          - {lang: "java", name: "commons-validator", repository: "apache/commons-validator", sha: "b4b130bd308965ccea69a487b1bdab0b897d1a7b"}
          - {lang: "java", name: "commons-lang", repository: "apache/commons-lang", sha: "5d2715b9da13fb584058d264c46dfed6bcc700d1"}
          - {lang: "java", name: "commons-codec", repository: "apache/commons-codec", sha: "c0013c15e4a5b2c72c60b17e0ac9eb2772250041"}
          - {lang: "java", name: "commons-text", repository: "apache/commons-text", sha: "ed3f23e12362f77d2b850e291458a0907da34d96"}
          - {lang: "java", name: "commons-io", repository: "apache/commons-io", sha: "a06ee11d2bf7fba46ccc419da69e2ff4a13986b5"}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - if: matrix.lang == 'java'
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with: {distribution: temurin, java-version: '21'}
      - name: Execute isolated native selector baseline
        run: |
          python3 research_20261107/real_pilot/runner.py \
            --repo "${{ matrix.repository }}" --sha "${{ matrix.sha }}" \
            --name "${{ matrix.name }}" --lang "${{ matrix.lang }}" \
            --out "$RUNNER_TEMP/pilot"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pilot-${{ matrix.name }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/pilot/result.json
            ${{ runner.temp }}/pilot/logs/
            ${{ runner.temp }}/pilot/upstream_pom.xml
          if-no-files-found: warn
          retention-days: 30
