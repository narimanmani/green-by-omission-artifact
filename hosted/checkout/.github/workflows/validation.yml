name: Private protected PR validation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  validate:
    name: ${{ matrix.check }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: testmon-required
            mode: selective
          - check: full-suite-diagnostic
            mode: full
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      MODE: ${{ matrix.mode }}
      FROZEN_BOOTSTRAP_BASE: edb0a2968fb5149dbc6d6f99f292d3174c840ef3
      PYTHONHASHSEED: "0"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - name: Require isolated private same-repository inputs
        env:
          PRIVATE: ${{ github.event.repository.private }}
          BASE_REPO: ${{ github.repository }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          test "$PRIVATE" = true
          test "$BASE_REPO" = "$HEAD_REPO"
      - name: Checkout exact trusted base
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: trusted
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: candidate
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Select immutable runner and dependencies
        run: |
          if [ "$BASE_SHA" = "$FROZEN_BOOTSTRAP_BASE" ]; then
            test ! -e trusted/.experiment/manifest.json
            INPUT_ROOT="$GITHUB_WORKSPACE/candidate"
            echo "MODE=bootstrap" >> "$GITHUB_ENV"
          else
            INPUT_ROOT="$GITHUB_WORKSPACE/trusted"
            git -C "$INPUT_ROOT" fetch "$GITHUB_WORKSPACE/candidate" "$HEAD_SHA"
          fi
          cp -R "$INPUT_ROOT/.experiment/runtime" "$RUNNER_TEMP/runtime"
          mkdir -p "$RUNNER_TEMP/evidence"
          echo "REPO_DIR=$INPUT_ROOT" >> "$GITHUB_ENV"
          echo "EVIDENCE_DIR=$RUNNER_TEMP/evidence" >> "$GITHUB_ENV"
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --only-binary=:all: --require-hashes --report "$RUNNER_TEMP/evidence/pip-install.json" -r "$INPUT_ROOT/.experiment/requirements.lock"
          "$RUNNER_TEMP/venv/bin/python" -m pip freeze --all > "$RUNNER_TEMP/evidence/pip-freeze.txt"
      - name: Execute published selector and unchanged security tests
        run: |
          "$RUNNER_TEMP/venv/bin/python" "$RUNNER_TEMP/runtime/hosted_runner.py"
      - name: Preserve raw private evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.mode }}-pr-${{ github.event.pull_request.number }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: error
          retention-days: 30
