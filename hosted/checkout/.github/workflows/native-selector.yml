name: Published independent selector validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  depper-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONHASHSEED: "0"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Install only published independent selector environment
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          python -m venv "$RUNNER_TEMP/depper"
          "$RUNNER_TEMP/depper/bin/python" -m pip install --only-binary=:all: --require-hashes --report "$RUNNER_TEMP/evidence/pip-install.json" -r .experiment/depper-requirements.lock
          "$RUNNER_TEMP/depper/bin/python" -m pip freeze --all > "$RUNNER_TEMP/evidence/pip-freeze.txt"
          "$RUNNER_TEMP/depper/bin/python" -m pytest --help > "$RUNNER_TEMP/evidence/pytest-help.txt"
      - name: Run exact original cases and all controls with clean Git histories
        run: |
          "$RUNNER_TEMP/depper/bin/python" .experiment/native_runner/run_cases.py .experiment/native-cases.json --output "$RUNNER_TEMP/evidence/cases"
      - name: Preserve private selected tests and full comparisons
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-depper-linux-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: error
          retention-days: 30
