name: Protected-base reviewed fixture validation

# Required companion administration policies:
# - all other workflow paths: only anonymous-owner may trigger execution;
# - this exact workflow path: only pull_request_target may trigger execution.
# Never execute PR worktree Python, helpers, tests, actions, or dependencies here.
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  actions: read

jobs:
  selection:
    name: trusted-fixture-selection
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Require private same-repository PR against the current default main
        env:
          PRIVATE: ${{ github.event.repository.private }}
          DEFAULT_SHA: ${{ github.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          test "$PRIVATE" = true
          test "$BASE_REF" = main
          test "$HEAD_REPO" = "$GITHUB_REPOSITORY"
          test "$BASE_SHA" = "$DEFAULT_SHA"
      - name: Checkout exact default-branch policy, runner, tests and dependencies
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: trusted
      - name: Read exact candidate Git objects without executing its worktree
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: candidate
      - name: Reject any candidate except the reviewed source-only fixture
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/source-policy
        run: python trusted/research_20261107/protected_ci.py validate
      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install only protected-base hash-locked dependencies
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --only-binary=:all: --require-hashes -r trusted/.experiment/requirements.lock
      - name: Find owner main-push cache for the exact protected base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/main-cache.yml/runs?event=push&branch=main&per_page=100" --jq ".workflow_runs[] | select(.head_sha == \"$BASE_SHA\" and .event == \"push\" and .head_branch == \"main\" and .path == \".github/workflows/main-cache.yml\" and .actor.login == \"anonymous-owner\" and .conclusion == \"success\") | .id" | head -n 1)"
          test -n "$RUN_ID"
          echo "TRUSTED_CACHE_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
      - name: Restore exact protected-base cache artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: testmon-cache-${{ github.event.pull_request.base.sha }}
          run-id: ${{ env.TRUSTED_CACHE_RUN_ID }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/trusted-testmon-cache
      - name: Measure protected-base fixture with native pytest-testmon
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/selective-evidence
          CACHE_DIR: ${{ runner.temp }}/trusted-testmon-cache
        run: '"$RUNNER_TEMP/venv/bin/python" trusted/research_20261107/protected_ci.py selective'
      - name: Preserve measured selection and source policy
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: main-selective-pr-${{ github.event.pull_request.number }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/selective-evidence/
            ${{ runner.temp }}/source-policy/
          if-no-files-found: warn
          retention-days: 30

  diagnostics:
    name: ${{ matrix.check }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: full-suite-diagnostic
            mode: full
          - check: fail-closed-ast-guard
            mode: guard
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Require private same-repository PR against current default main
        env:
          PRIVATE: ${{ github.event.repository.private }}
          DEFAULT_SHA: ${{ github.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          test "$PRIVATE" = true
          test "$BASE_REF" = main
          test "$HEAD_REPO" = "$GITHUB_REPOSITORY"
          test "$BASE_SHA" = "$DEFAULT_SHA"
      - name: Checkout protected-base code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: trusted
      - name: Read candidate Git objects
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: candidate
      - name: Validate the exact reviewed fixture before any execution
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/source-policy
        run: python trusted/research_20261107/protected_ci.py validate
      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install protected-base dependencies
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --only-binary=:all: --require-hashes -r trusted/.experiment/requirements.lock
      - name: Execute diagnostic against the protected-base fixture
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/diagnostic-evidence
          MODE: ${{ matrix.mode }}
        run: '"$RUNNER_TEMP/venv/bin/python" trusted/research_20261107/protected_ci.py "$MODE"'
      - name: Preserve diagnostic measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.mode }}-main-pr-${{ github.event.pull_request.number }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/diagnostic-evidence/
          if-no-files-found: warn
          retention-days: 30

  report:
    name: publish-exact-head-testmon-status
    needs: selection
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      statuses: write
      pull-requests: read
    steps:
      # A fresh runner with no checkout, fixture execution or artifact ingestion.
      - name: Publish only for the current PR head and base
        env:
          GH_TOKEN: ${{ github.token }}
          SELECTION_RESULT: ${{ needs.selection.result }}
        run: |
          python - <<'PY'
          import json, os, re, urllib.request
          from pathlib import Path
          event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          pr = event['pull_request']
          repo = os.environ['GITHUB_REPOSITORY']
          head, base = pr['head']['sha'], pr['base']['sha']
          assert re.fullmatch(r'[0-9a-f]{40}', head)
          assert re.fullmatch(r'[0-9a-f]{40}', base)
          assert event['repository']['private'] and pr['base']['ref'] == 'main'
          assert pr['head']['repo']['full_name'] == repo
          assert base == os.environ['GITHUB_SHA']
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                     'Accept': 'application/vnd.github+json',
                     'X-GitHub-Api-Version': '2022-11-28'}
          api = os.environ['GITHUB_API_URL']
          def request(path, data=None):
              req = urllib.request.Request(api + path, headers=headers,
                    data=None if data is None else json.dumps(data).encode())
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)
          current = request('/repos/' + repo + '/pulls/' + str(int(event['number'])))
          if (current['state'] != 'open' or current['head']['sha'] != head or
                  current['base']['sha'] != base or current['base']['ref'] != 'main'):
              print('Stale event: no status published')
              raise SystemExit(0)
          state = 'success' if os.environ['SELECTION_RESULT'] == 'success' else 'failure'
          request('/repos/' + repo + '/statuses/' + head, {
              'state': state, 'context': 'testmon-required',
              'description': 'Reviewed fixture policy and measured native selection: ' + state,
              'target_url': os.environ['GITHUB_SERVER_URL'] + '/' + repo +
                            '/actions/runs/' + os.environ['GITHUB_RUN_ID']})
          print('Published testmon-required=' + state + ' for PR head ' + head)
          PY

