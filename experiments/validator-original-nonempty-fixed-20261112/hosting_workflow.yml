name: Frozen original-test Ekstazi replay
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixed-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Verify frozen package
        run: python3 verify_package.py
      - name: Build provisioned lab image
        run: docker build --pull -t sp2027-fixed-original-nonempty .
      - name: Execute three fresh isolated repetitions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          image_id="$(docker image inspect sp2027-fixed-original-nonempty --format '{{.Id}}')"
          docker image inspect "$image_id" > evidence/image-inspect.json
          printf '%s\n' "$image_id" > evidence/image-id.txt
          for n in 1 2 3; do
            cid="$(docker run -d --network none --read-only --user 10001:10001 --cap-drop ALL --security-opt no-new-privileges --cpus 2 --memory 5g --memory-swap 5g --pids-limit 256 --tmpfs /work:rw,exec,nosuid,size=3g,uid=10001,gid=10001,mode=0700 --tmpfs /tmp:rw,exec,nosuid,size=256m,uid=10001,gid=10001,mode=0700 "$image_id")"
            ready=0
            for attempt in $(seq 1 180); do
              if docker exec "$cid" test -f /work/out/READY; then ready=1; break; fi
              if [ "$(docker inspect "$cid" --format '{{.State.Running}}')" != true ]; then break; fi
              sleep 5
            done
            mkdir -p "evidence/repetition-$n"
            docker logs "$cid" > "evidence/repetition-$n/container.log" 2>&1 || true
            if [ "$ready" -eq 1 ]; then
              docker exec "$cid" tar -C /work/out -cf - . | tar -C "evidence/repetition-$n" -xf -
            fi
            docker rm -f "$cid" >/dev/null
            if [ "$ready" -ne 1 ]; then echo "Container $n ended before evidence handoff" >&2; exit 2; fi
            if [ "$(cat "evidence/repetition-$n/runner-exit")" -ne 0 ]; then echo "Repetition $n failed eligibility; stop per protocol" >&2; exit 2; fi
          done
          python3 hosting_audit.py evidence
      - name: Upload private evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frozen-original-test-evidence
          path: evidence/
          if-no-files-found: warn
          retention-days: 30
